<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ECODRY, showcase frame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 105% at 50% 28%, #fdf9ef 0%, #fbf5e9 48%, #f0e3c6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .lid {
    width: 1156px;
    padding: 24px 22px 26px;
    border-radius: 22px 22px 6px 6px;
    background: linear-gradient(180deg, #34373c 0%, #1e2023 58%, #16171a 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .20), inset 0 -1px 0 rgba(0, 0, 0, .55);
    position: relative;
  }
  .cam {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #060708;
    box-shadow: inset 0 0 2px 1px #3d5a74, 0 0 0 1px rgba(255, 255, 255, .07);
  }
  .screen {
    border-radius: 5px;
    overflow: hidden;
    background: #fbf5e9;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35);
  }
  iframe { width: 1112px; height: 628px; border: 0; display: block; background: #fbf5e9; }
  .base {
    width: 1232px;
    height: 17px;
    background: linear-gradient(180deg, #ccd0d5 0%, #a2a7af 38%, #7b8089 100%);
    border-radius: 3px 3px 16px 16px;
    position: relative;
    box-shadow: 0 20px 36px rgba(96, 74, 28, .30);
  }
  .base::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 7px;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(180deg, #83888f, #a9aeb6);
  }
  .shadow {
    width: 1080px;
    height: 26px;
    margin-top: 15px;
    border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(84, 62, 20, .30), rgba(84, 62, 20, 0) 70%);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="lid">
      <span class="cam"></span>
      <div class="screen"><iframe id="site" src="index.html" title="ECODRY"></iframe></div>
    </div>
    <div class="base"></div>
    <div class="shadow"></div>
  </div>
</body>
</html>
